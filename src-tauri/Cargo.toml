[package]
name = "wedex"
version = "0.1.0"
description = "A WeChat-inspired desktop interface for Codex"
authors = ["wedex contributors"]
edition = "2021"

[lib]
name = "wedex_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["macos-private-api"]
macos-private-api = ["tauri/macos-private-api"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
